      ? '<rect class="scanbeam" x="30" y="22" width="140" height="12" rx="6" fill="rgba(79,209,197,.75)"/>'
      : '<circle class="pulse" cx="100" cy="200" r="30" fill="none" stroke="#4fd1c5" stroke-width="3"/>' +
        '<text x="100" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#4fd1c5">المس هنا</text>';
    rp.handlers = {
      down(e) {
        if (!inRect(e, rp.svg) || sd.scan) return;
        if (!checkTool(step)) return;
        sd.scan = true;
        rpRender();
        sfx('click');
        setTimeout(() => { if (rp.open && currentStep(rp.job) === step) completeStep(); }, 950);
      }
    };
  },

  shards(step, sd, job) {
    rp.layerFn = null;
    rp.handlers = {
      down(e) {
        const t = e.target.closest ? e.target.closest('[data-shard]') : null;
        if (!t) return;
        if (!checkTool(step)) return;
        const i = Number(t.getAttribute('data-shard'));
        job.v.shards[i] = false;
        job.old.push('🔹');
        renderTrays();
        sfx('click');
        vibrate(15);
        if (job.v.shards.every(s => !s)) { job.v.scr = 'bare'; completeStep(); } else rpRender();
      }
    };
  },

  peel(step, sd, job) {
    const tabY = () => 22 + 356 * job.v.film;
    rp.layerFn = () => '<rect id="filmTab" x="82" y="' + (tabY() - 6) + '" width="36" height="22" rx="4" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>';
    let start = null;
    rp.handlers = {
      down(e) {
        const p = svgPt(e);
        if (Math.abs(p.x - 100) > 36 || Math.abs(p.y - (tabY() + 4)) > 32) return;
        if (!checkTool(step)) return;
        start = { y: p.y, film: job.v.film };
      },
      move(e) {
        if (!start) return;
        const p = svgPt(e);
        job.v.film = clampNum(start.film - (start.y - p.y) / 356, 0, 1);
        const f = $('filmRect'), t = $('filmTab');
        if (f) f.setAttribute('height', 356 * job.v.film);
        if (t) t.setAttribute('y', 22 + 356 * job.v.film - 6);
        if (job.v.film <= 0.04) { job.v.film = 0; start = null; completeStep(); }
      },
      up() { start = null; }
    };
  },

  wipe(step, sd, job) {
    if (!sd.spots) {
      sd.spots = [];
      [[60, 70], [130, 95], [85, 160], [140, 210], [60, 260], [110, 310], [75, 350]].forEach(p =>
        sd.spots.push({ x: p[0], y: p[1], r: 17 + Math.random() * 6, s: 1 }));
    }
    rp.layerFn = () => sd.spots.map((s, i) => '<circle id="sp' + i + '" cx="' + s.x + '" cy="' + s.y + '" r="' + s.r +
      '" fill="#6b4f2a" opacity="' + (Math.max(0, s.s) * 0.65) + '"/>').join('') +
      '<circle id="wipeCur" cx="-50" cy="-50" r="13" fill="rgba(255,255,255,.55)" stroke="#4fd1c5" stroke-width="2"/>';
    let wiping = false;
    const doWipe = (e) => {
      const p = svgPt(e);
      const cur = $('wipeCur');
      if (cur) { cur.setAttribute('cx', p.x); cur.setAttribute('cy', p.y); }
      let all = true;
      sd.spots.forEach((s, i) => {
        if (s.s > 0) {
          if (Math.hypot(p.x - s.x, p.y - s.y) < s.r + 14) {
            s.s -= 0.12;
            const el = $('sp' + i);
            if (el) el.setAttribute('opacity', Math.max(0, s.s) * 0.65);
          }
          if (s.s > 0) all = false;
        }
      });
      if (all) { wiping = false; job.v.clean = true; completeStep(); }
    };
    rp.handlers = {
      down(e) { if (!inRect(e, rp.svg)) return; if (!checkTool(step)) return; wiping = true; doWipe(e); },
      move(e) { if (wiping) doWipe(e); },
      up() { wiping = false; }
    };
  },

  glue(step, sd, job) {
    // Two narrow adhesive rails on the left and right edges of the display.
    // The player must trace both rails with a continuous finger/stylus drag.
    if (!sd.rails) sd.rails = [0, 0];
    rp.layerFn = () => {
      const leftY = 42 + sd.rails[0] * 310, rightY = 42 + sd.rails[1] * 310;
      let glueDots = '';
      for (let n = 0; n < 10; n++) {
        const y = 48 + n * 32;
        glueDots += '<circle cx="36" cy="' + y + '" r="7.5" fill="' + (y <= leftY ? '#facc15' : '#fde68a') + '" stroke="#a16207" stroke-width="1.2" opacity=".98"/>' +
          '<circle cx="164" cy="' + y + '" r="7.5" fill="' + (y <= rightY ? '#facc15' : '#fde68a') + '" stroke="#a16207" stroke-width="1.2" opacity=".98"/>';
      }
      return '<rect x="31" y="28" width="138" height="344" rx="16" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="4 5" opacity=".8"/>' +
        '<path d="M36 42 V352 M164 42 V352" fill="none" stroke="#facc15" stroke-width="12" stroke-linecap="round" opacity=".2"/>' +
        '<path d="M36 42 V' + leftY + '" fill="none" stroke="#facc15" stroke-width="9" stroke-linecap="round"/>' +
        '<path d="M164 42 V' + rightY + '" fill="none" stroke="#facc15" stroke-width="9" stroke-linecap="round"/>' + glueDots +
        '<circle cx="36" cy="' + leftY + '" r="7" fill="#fff3a3" stroke="#ca8a04" stroke-width="2"/>' +
        '<circle cx="164" cy="' + rightY + '" r="7" fill="#fff3a3" stroke="#ca8a04" stroke-width="2"/>' +
        '<text x="100" y="195" text-anchor="middle" font-size="12" font-weight="800" fill="#fef3c7">لاصق الشاشة</text>' +
        '<text x="100" y="214" text-anchor="middle" font-size="10" fill="#fff">مرّر على الجانبين</text>';
    };
    let rail = -1, lastY = 0;
    rp.handlers = {
      down(e) {
        if (!inRect(e, rp.svg) || !checkTool(step)) return;
        const p = svgPt(e);
        const side = p.x < 82 ? 0 : (p.x > 118 ? 1 : -1);
        if (side < 0 || p.y < 32 || p.y > 365) { toast('ابدأ من المسار الأصفر على أحد جانبي الشاشة'); return; }
        if (p.y > 92) { toast('ابدأ من أعلى الحافة ثم اسحب إلى الأسفل'); return; }
        rail = side; lastY = p.y;
        sd.rails[rail] = Math.max(sd.rails[rail], clampNum((p.y - 42) / 310, 0, 1));
        rpRender();
      },
      move(e) {
        if (rail < 0) return;
        const p = svgPt(e);
        const expectedX = rail === 0 ? p.x < 86 : p.x > 114;
        if (!expectedX) return;
        if (p.y >= lastY - 2) sd.rails[rail] = Math.max(sd.rails[rail], clampNum((p.y - 42) / 310, 0, 1));
        lastY = p.y;
        rpRender();
      },
      up() {
        rail = -1;
        if (sd.rails[0] >= .97 && sd.rails[1] >= .97) {
          job.v.adhesiveApplied = true;
          sfx('success');
          toast('ممتاز! وُضع اللاصق على الحافتين بالتساوي');
          completeStep();
        }
      }
    };
  },

  place(step, sd, job) {
    rp.layerFn = () => '<rect class="pulse" x="26" y="18" width="148" height="364" rx="22" fill="none" stroke="#4fd1c5" stroke-width="3" stroke-dasharray="8 6"/>';
    rp.handlers = {
      down(e) {
        const it = e.target.closest ? e.target.closest('.item') : null;
        if (!it || it.dataset.item !== step.item) return;
        if (!checkTool(step)) return;
        it.classList.add('ghost');
        startDrag(e, itemIcon(step.item), (ev) => {
          if (inRect(ev, rp.svg)) {
            if (step.item === 'screen') { job.v.scr = 'new'; job.v.screenSeated = true; }
            else if (step.item === 'protector') job.v.protector = true;
            else job.v.part = 'new';
            completeStep();
          } else {
            it.classList.remove('ghost');
          }
        }, () => it.classList.remove('ghost'));
      }
    };
  },

  squeegee(step, sd, job) {
    if (!sd.b) {
      sd.b = [];
      [[60, 80], [120, 120], [90, 180], [135, 240], [65, 270], [105, 320], [140, 60]].forEach(p =>
        sd.b.push({ x: p[0], y: p[1], r: 11 + Math.random() * 4, gone: false }));
    }
    rp.layerFn = () => sd.b.map((b, i) => b.gone ? '' : '<circle id="bb' + i + '" cx="' + b.x + '" cy="' + b.y + '" r="' + b.r +
      '" fill="rgba(255,255,255,.35)" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>').join('') +
      '<rect id="sqLine" x="-80" y="-80" width="60" height="6" rx="3" fill="#4fd1c5"/>';
    let last = null;
    const sweep = (e) => {
      const p = svgPt(e);
      const ln = $('sqLine');
      if (ln) { ln.setAttribute('x', p.x - 30); ln.setAttribute('y', p.y - 3); }
      if (!last) { last = p; return; }
      const dx = p.x - last.x, dy = p.y - last.y;
      last = p;
      let all = true;
      sd.b.forEach((b, i) => {
        if (b.gone) return;
        if (Math.abs(p.x - b.x) < 44 && Math.abs(p.y - b.y) < b.r + 18) {
          b.x += dx * 3; b.y += dy * 3;
          if (b.x < 34 || b.x > 166 || b.y < 26 || b.y > 374) {
            b.gone = true;
            const el = $('bb' + i);
            if (el) el.remove();
          } else {
            const el = $('bb' + i);
            if (el) { el.setAttribute('cx', b.x); el.setAttribute('cy', b.y); }
          }
        }
        if (!b.gone) all = false;
      });
      if (all) { last = null; completeStep(); }
    };
    rp.handlers = {
      down(e) { if (!inRect(e, rp.svg)) return; if (!checkTool(step)) return; last = svgPt(e); sweep(e); },
      move(e) { if (last) sweep(e); },
      up() { last = null; }
    };
  },

  screws(step, sd, job) {
    const v = job.v;
    const shieldStep = step.mode === 'open' && step.title.includes('صفيحة');
    const positions = shieldStep ? [[70,130],[130,130],[70,254],[130,254]] : SCREW_POS;
    if (shieldStep && !sd.init) { sd.init = true; v.shieldCovered = true; v.screws = [true, true, true, true]; }
    if (step.mode === 'close' && !sd.init) { sd.init = true; v.covered = true; v.shieldCovered = false; v.screws = [false, false, false, false]; }
    rp.layerFn = null;
    let holdTimer = null, activeIdx = -1, startPoint = null;
    const clearHold = () => { if (holdTimer) clearTimeout(holdTimer); holdTimer = null; activeIdx = -1; startPoint = null; };
    const applyScrew = (idx) => {
      if (idx < 0 || rp.locked) return;
      if (step.mode === 'open') {
        v.screws[idx] = false;
        job.old.push('🔩');
        if (v.screws.every(s => !s)) { if (shieldStep) v.shieldCovered = false; else v.covered = false; completeStep(); return; }
      } else {
        v.screws[idx] = true;
        const k = job.old.lastIndexOf('🔩');
        if (k >= 0) job.old.splice(k, 1);
        if (v.screws.every(s => s)) { completeStep(); return; }
      }
      renderTrays(); rpRender(); sfx('click'); vibrate(15);
    };
    rp.handlers = {
      down(e) {
        if (!inRect(e, rp.svg)) return;
        const p = svgPt(e); let idx = -1, best = 999;
        positions.forEach((s, i) => {
          const d = Math.hypot(p.x - s[0], p.y - s[1]);
          const ok = step.mode === 'open' ? v.screws[i] : !v.screws[i];
          if (ok && d < best) { best = d; idx = i; }
        });
        if (idx < 0 || best > 24 || !checkTool(step)) return;
        clearHold(); activeIdx = idx; startPoint = p;
        rp.layerFn = () => '<circle class="pulse" cx="' + positions[idx][0] + '" cy="' + positions[idx][1] + '" r="13" fill="none" stroke="#4fd1c5" stroke-width="4"/><text x="100" y="200" text-anchor="middle" font-size="13" fill="#ffffff">اضغط على البرغي لفكّه</text>';
        rpRender();
        holdTimer = setTimeout(() => { const target = activeIdx; clearHold(); rp.layerFn = null; applyScrew(target); }, 500);
      },
      move(e) {
        if (activeIdx < 0 || !startPoint) return;
        const p = svgPt(e), screw = positions[activeIdx];
        if (Math.hypot(p.x - screw[0], p.y - screw[1]) > 28) { clearHold(); rp.layerFn = null; rpRender(); }
      },
      up() {
        // Mobile browsers often deliver pointerup before a long-press timer
        // fires. Treat a deliberate tap on a screw as a valid action too.
        if (holdTimer && activeIdx >= 0) {
          const target = activeIdx;
          clearHold(); rp.layerFn = null;
          applyScrew(target);
          if (!rp.locked) rpRender();
        }
      }
    };
  },

  remove(step, sd, job) {
    rp.layerFn = () => '<circle class="pulse" cx="100" cy="200" r="42" fill="none" stroke="#fbbf24" stroke-width="3"/>';
    rp.handlers = {
      down(e) {
        const p = svgPt(e);
        if (Math.hypot(p.x - 100, p.y - 200) > 42 || job.v.part !== 'old') return;
        if (!checkTool(step)) return;
        job.v.part = 'moving';
        rpRender();
        const icon = PARTS[step.item].icon;
        startDrag(e, icon, (ev) => {
          if (inRect(ev, $('trayOld'))) {
            job.v.part = 'none';
            job.old.push(icon);
            completeStep();
          } else {
            job.v.part = 'old';
            rpRender();
          }
        }, () => { job.v.part = 'old'; rpRender(); });
      }
    };
  },

  hold(step, sd, job) {
    sd.t = sd.t || 0;
    const R = 44, C = 2 * Math.PI * R;
    rp.layerFn = () => '<circle cx="100" cy="200" r="54" fill="rgba(0,0,0,.5)"/>' +
      '<circle cx="100" cy="200" r="' + R + '" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/>' +
      '<circle id="holdRing" cx="100" cy="200" r="' + R + '" fill="none" stroke="#4fd1c5" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + C +
      '" stroke-dashoffset="' + (C * (1 - sd.t / 1.4)) + '" transform="rotate(-90 100 200)"/>' +
      '<text x="100" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">' + (step.label || 'اضغط') + '</text>';
    rp.handlers = {
      down(e) {
        const p = svgPt(e);
        if (Math.hypot(p.x - 100, p.y - 200) > 58) return;
        if (!checkTool(step)) return;
        rp.holding = true;
      },
      up() { rp.holding = false; }
    };
  },

  case(step, sd, job) {
    rp.layerFn = null;
    rp.handlers = {
      down(e) {
        const sw = e.target.closest ? e.target.closest('.sw') : null;
        if (!sw) return;
        const id = sw.dataset.case;
        const c = caseOf(id);
        job.v.caseColor = c.hex;
        rpRender();
        sfx('click');
        const want = job.order && job.order.caseId;
        if (want && id !== want) {
          mistake('هذا ليس اللون الذي طلبه الزبون');
          setTimeout(() => {
            if (rp.open && !rp.locked && currentStep(job) === step) { job.v.caseColor = null; rpRender(); renderCard(); }
          }, 800);
          renderCard();
        } else {
          completeStep();
        }
      }
    };
  }
};

// Per-frame work for the repair view.
function repairUpdate(dt) {
  const job = rp.job;
  if (!job || rp.locked) return;
  const step = currentStep(job);
  if (!step || step.kind !== 'hold') return;
  const sd = job.sd;
  sd.t = rp.holding ? sd.t + dt : Math.max(0, sd.t - dt * 1.5);
  const ring = $('holdRing');
  if (ring) {
    const C = 2 * Math.PI * 44;
    ring.setAttribute('stroke-dashoffset', C * (1 - Math.min(1, sd.t / 1.4)));
  }
  if (sd.t >= 1.4) { rp.holding = false; completeStep(); }
}

// ===== Main loop =====
function update(dt) {
  if (mode === 'cine') {
    updateCinematic(dt);
  } else if (mode === 'read') {
    updateReading(dt);
  } else if ((mode === 'play' && openPanel === null) || mode === 'repair') {
    G.minutes += MINUTES_PER_SECOND * dt * (mode === 'repair' ? REPAIR_TIME_SCALE : 1);
    if (G.minutes >= DAY_END) {
      G.minutes = DAY_END - 1;
      if (mode === 'repair') exitRepair();
      endDay(true);
    } else {
      if (mode === 'play') updatePlayer(dt);
      updateCustomers(dt);
      trafficTick();
      bench.update();
      if (mode === 'repair') {
        if (!bench.job || bench.job !== rp.job) exitRepair('غادر الزبون');
        else repairUpdate(dt);
      }
      if (!shopClosedNotified && G.minutes >= SHOP_CLOSE) {
        shopClosedNotified = true;
        toast('أُغلق المحل');
      }
      autosaveTimer += dt;
      if (autosaveTimer >= AUTOSAVE_SECONDS) {
        autosaveTimer = 0;
        autosaveNow();
      }
    }
  }
  syncPlayerVisual(dt);
  updateZones(dt);
  updateCamera(dt);
  updateLighting();
  updateWorldLife(dt);
  hudAcc += dt;
  if ((mode === 'play' || mode === 'cine') && hudAcc >= 0.08) { hudAcc = 0; updateHud(); }
}
let hudAcc = 1;

let lastTime = performance.now();
let frameNo = 0, perfAcc = 0, perfCnt = 0, perfCool = 3;
function perfTick(rawDt) {
  if (rawDt > 0.5 || document.hidden) { perfAcc = 0; perfCnt = 0; return; }
  perfAcc += rawDt; perfCnt++;
  if (perfCnt < 45) return;
  const avg = perfAcc / perfCnt; perfAcc = 0; perfCnt = 0;
  perfCool -= 0.75;
  if (perfCool > 0) return;
  const q = QUALITY[settings.quality] || QUALITY.medium;
  const base = Math.min(window.devicePixelRatio || 1, q.pr);
  if (avg > 0.026 && dynPR > 0.55) { dynPR = Math.max(0.55, dynPR - 0.15); perfCool = 2; renderer.setPixelRatio(base * dynPR); }
  else if (avg < 0.0185 && dynPR < 1) { dynPR = Math.min(1, dynPR + 0.1); perfCool = 4; renderer.setPixelRatio(base * dynPR); }
}
function frame(now) {
  const rawDt = (now - lastTime) / 1000;
  const dt = clampNum(rawDt, 0, 0.1);
  lastTime = now;
  perfTick(rawDt);
  try {
    update(dt);
  } catch (err) {
    console.error(err);
  }
  if (mode !== 'repair') {
    const q = QUALITY[settings.quality] || QUALITY.medium;
    if (q.shadows && q.skip > 1) { frameNo++; renderer.shadowMap.needsUpdate = (frameNo % q.skip) === 0; renderer.shadowMap.autoUpdate = false; }
    else renderer.shadowMap.autoUpdate = true;
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  fitPhone();
}

// ===== Input wiring =====
const PREVENT_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);

window.addEventListener('keydown', (e) => {
  if (PREVENT_KEYS.has(e.code)) e.preventDefault();
  input.keys.add(e.code);
  if (e.repeat) return;
  if (e.code === 'Escape') {
    if (mode === 'repair') exitRepair();
    else if (mode === 'play' && openPanel === null) showPanel('pPause');
    else if (openPanel === 'pPause') closePanel();
  } else if (e.code === 'KeyE') interact();
  else if (e.code === 'Space') input.jumpQueued = true;
  else if (mode === 'repair' && e.code.indexOf('Digit') === 0) {
    const t = TOOLS[Number(e.code.slice(5)) - 1];
    if (t) { rp.tool = t; renderTools(); }
  }
});
window.addEventListener('keyup', (e) => input.keys.delete(e.code));
window.addEventListener('blur', () => input.keys.clear());

// Joystick (left side): floating — touch anywhere on the left half to move
const joyEl = $('joy');
const knobEl = $('knob');
let joyPointer = null, joyCx = 0, joyCy = 0, joyR = 60, joyFloating = false;
const JOY_DEAD = 0.07, JOY_FULL = 0.85;

function joyReset() {
  joyPointer = null;
  input.joy.x = 0; input.joy.y = 0;
  knobEl.style.transform = '';
  if (joyFloating) { joyEl.style.left = joyEl.style.top = joyEl.style.bottom = ''; joyFloating = false; }
  joyEl.classList.remove('active');
}
function joyMove(e) {
  let dx = (e.clientX - joyCx) / joyR, dy = (e.clientY - joyCy) / joyR;
  const len = Math.hypot(dx, dy);
  const lim = Math.min(len, 1);
  if (len > 1) { dx /= len; dy /= len; }
  knobEl.style.transform = 'translate(' + (dx * joyR * 0.62) + 'px,' + (dy * joyR * 0.62) + 'px)';
  if (lim < JOY_DEAD) { input.joy.x = 0; input.joy.y = 0; return; }
  const m = Math.min(1, (lim - JOY_DEAD) / (JOY_FULL - JOY_DEAD));
  const nx = dx / (Math.hypot(dx, dy) || 1), ny = dy / (Math.hypot(dx, dy) || 1);
  input.joy.x = nx * m;
  input.joy.y = -ny * m;
}
window.addEventListener('pointerdown', (e) => {
  if (joyPointer !== null || mode !== 'play' || openPanel !== null) return;
  if (e.pointerType === 'mouse' && !(e.target && e.target.closest && e.target.closest('#joy'))) return;
  const onJoy = e.target && e.target.closest && e.target.closest('#joy');
  if (!onJoy) {
    if (e.clientX > window.innerWidth * 0.5) return;
    if (e.target && e.target.closest && e.target.closest('.ctrl, .panel, .screen, .cine, #repair, #placeBar, button, input')) return;
  }
  const r = joyEl.getBoundingClientRect();
  joyR = Math.max(40, r.width / 2);
  if (onJoy) { joyCx = r.left + r.width / 2; joyCy = r.top + r.height / 2; }
  else {
    joyCx = e.clientX; joyCy = e.clientY; joyFloating = true;
    joyEl.style.left = (joyCx - joyR) + 'px'; joyEl.style.top = (joyCy - joyR) + 'px'; joyEl.style.bottom = 'auto';
  }
  joyPointer = e.pointerId;
  joyEl.classList.add('active');
  joyMove(e);
  if (e.cancelable) e.preventDefault();

// ----- green floor chevrons toward the next purchase pad -----
const CHEV = (function () {
  const g = new THREE.Group(), sh = new THREE.Shape();
  sh.moveTo(0, 0.42); sh.lineTo(0.42, 0); sh.lineTo(0.42, -0.2); sh.lineTo(0, 0.2); sh.lineTo(-0.42, -0.2); sh.lineTo(-0.42, 0); sh.closePath();
  const geo = new THREE.ShapeGeometry(sh); geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({ color: 0x3ddc6a, transparent: true, opacity: 0.9, depthWrite: false });
  const items = [];

})();
{
  const _uz = updateZones;

    const ang = Math.atan2(-dx, -dz), t0 = performance.now() * 0.0007;
    CHEV.items.forEach((m, i) => {

      m.position.set(p.x + dx / d * r, 0.04, p.z + dz / d * r);

    });
  };
}

// ----- pastel skyline around the playable area (distant blocky buildings with blue windows) -----
(function () {
  const city = new THREE.Group(); scene.add(city);
  const pal = ['#c9b8f2', '#a8e3d0', '#f8cdb8', '#f6e4a6', '#a5d8f5', '#f9b7c8'];
  const bases = pal.map(col => ctex(64, 128, (c, w, h) => {
    c.fillStyle = col; c.fillRect(0, 0, w, h);
    for (let r = 0; r < 4; r++) for (let q = 0; q < 2; q++) {
      c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(7 + q * 28, 9 + r * 30, 26, 22);
      c.fillStyle = '#6fb2ea'; c.fillRect(9 + q * 28, 11 + r * 30, 22, 18);
    }
    c.fillStyle = 'rgba(0,0,0,.08)'; c.fillRect(0, h - 10, w, 10);
  }, 1, 1));
  const step = LOW_END ? 17 : 12;
  let n = 0;
  const add = (x, z) => {
    const k = n++, ci = k % pal.length;
    const w = 8 + (k * 7) % 5, d = 8 + (k * 3) % 4, h = 11 + (k * 13) % 15;
    const t = bases[ci].clone(); t.needsUpdate = true; t.repeat.set(Math.max(1, Math.round(w / 4)), Math.max(1, Math.round(h / 5)));
    const side = new THREE.MeshStandardMaterial({ map: t, roughness: 0.9 });
    const top = new THREE.MeshStandardMaterial({ color: new THREE.Color(pal[ci]).multiplyScalar(0.85), roughness: 0.9 });
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, top, top, side, side]);
    m.position.set(x, h / 2, z); m.castShadow = false; m.receiveShadow = false;
    city.add(m);
    if (k % 3 === 0) { const r = new THREE.Mesh(new THREE.BoxGeometry(w * 0.4, 1.6, d * 0.4), top); r.position.set(x, h + 0.8, z); city.add(r); }
  };
  for (let x = -72; x <= 72; x += step) { add(x + 3, -18); add(x + 8, -34); add(x, 48); add(x + 6, 64); }
  for (let z = -10; z <= 60; z += step) { add(-92, z); add(92, z + 5); add(-108, z + 3); add(108, z); }
  // a few far trees on the grass beside the roads
  for (let x = -70; x <= 70; x += 16) { voxTree(city, x + 5, -9, 1.3, x > 0); voxTree(city, x, 40, 1.3, x < 0); }
})();
