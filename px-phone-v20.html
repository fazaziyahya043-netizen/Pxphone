<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PX Phone</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0f15;--panel:rgba(12,16,22,.92);--line:rgba(255,255,255,.16);--text:#f2f5f8;--muted:#9aa7b4;--accent:#4fd1c5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 30%,#1b2836,#0b0f15)}
.logo{font-size:44px;font-weight:900;letter-spacing:4px;color:var(--accent)}
.battery{width:230px;height:76px;border:4px solid #dfe6ee;border-radius:12px;padding:6px;position:relative}
.battery::after{content:"";position:absolute;right:-15px;top:22px;width:9px;height:24px;background:#dfe6ee;border-radius:0 5px 5px 0}
.battery .fill{height:100%;width:0%;border-radius:6px;background:linear-gradient(90deg,#2fb36b,#7bd88f);transition:width .3s}
.pct{color:var(--muted);font-size:18px}
.col{display:flex;flex-direction:column;gap:12px;width:min(80vw,300px)}
/* Panels sit above the black fade (z 40) so the day report is visible. */
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;z-index:50;display:flex;flex-direction:column;gap:10px}
.panel.wide{width:min(94vw,860px)}
.shop-panel{padding-top:54px;box-shadow:0 22px 70px rgba(0,0,0,.48);backdrop-filter:blur(16px)}
.shop-close{position:sticky;top:0;align-self:flex-start;z-index:3;margin-top:-43px;margin-bottom:0;width:42px;min-width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;font-size:23px;background:rgba(220,55,70,.95);border-color:rgba(255,255,255,.65);box-shadow:0 5px 18px rgba(0,0,0,.35)}
.shop-close:active{transform:scale(.94)}
.shop-panel h2{padding-inline-end:42px}
#pBuyConfirm{border-color:var(--accent);box-shadow:0 24px 80px rgba(0,0,0,.55)}
.panel h2{margin:0;font-size:22px;color:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px;flex-wrap:wrap}
.sec{margin-top:8px;font-weight:700;color:var(--accent);font-size:17px}
.btn{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:17px;font-weight:700;min-height:48px;cursor:pointer}
.btn.primary{background:rgba(79,209,197,.26);border-color:var(--accent)}
.btn.small{min-height:36px;padding:6px 10px;font-size:15px}
.btn.on{background:rgba(79,209,197,.45)}
.btn:disabled{opacity:.4}
.btn small{display:block;font-size:12px;opacity:.7}
.bookicon{font-size:64px;text-align:center}
.booktext{font-size:19px;line-height:1.8;margin:0}
.hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.ctrl{pointer-events:auto}
.topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font:inherit;font-size:16px;font-weight:700;color:var(--text)}
.hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid #ffe08a;border-radius:12px;padding:6px 14px;font-size:15px;color:#ffe08a;max-width:62vw;text-align:center}
.hint:empty{display:none}
.orders{position:absolute;top:calc(env(safe-area-inset-top,0px) + 104px);right:12px;background:var(--panel);border-radius:10px;padding:8px 12px;font-size:14px;white-space:pre-line;text-align:right;max-width:40vw;color:var(--muted)}
.orders:empty{display:none}
.side{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;flex-direction:column;gap:8px}
.sidebtn{pointer-events:auto;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;font:inherit;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:0;min-width:66px;font-size:26px;cursor:pointer}
.sidebtn small{font-size:13px;font-weight:700}
.sidebtn.gift{border-color:#ffd166;background:rgba(255,209,102,.2)}
.badge{position:absolute;top:-8px;right:-8px;background:#e5484d;color:#fff;border-radius:50%;min-width:24px;height:24px;font-size:14px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}
.toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-size:16px;white-space:nowrap;opacity:0;transition:opacity .25s;z-index:5}
.toast.show{opacity:1}
.prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 200px);background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:8px 14px;font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap;display:none}
.prompt.show{display:block}
.joy{touch-action:none;will-change:transform;position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid var(--line)}
.knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(79,209,197,.55);pointer-events:none;will-change:transform}
.joy.active{background:rgba(255,255,255,.18);border-color:rgba(79,209,197,.8)}
.joy.active .knob{background:rgba(79,209,197,.85)}
.actions{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;grid-template-columns:1fr 1fr;gap:10px;width:180px}
.span2{grid-column:1/span 2}
.xp{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(36vw,380px);display:flex;align-items:center;gap:8px;direction:ltr}
.lvl{width:56px;height:56px;border-radius:50%;background:#fff;color:#1e293b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:24px;border:3px solid #4aa3ff;line-height:1}
.lvl small{font-size:10px;opacity:.6}
.bar{flex:1;height:28px;background:#d6dce8;border-radius:16px;border:3px solid #1e293b;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:#2f80ed;width:0%}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#1e293b;font-weight:700;direction:rtl}
.cine{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:120px;pointer-events:none}
.cinetext{background:var(--panel);border-radius:12px;padding:14px 20px;font-size:21px;max-width:88vw;text-align:center}
#cineSkip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;pointer-events:auto}
#fade{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .9s;pointer-events:none;z-index:40}
#fade.on{opacity:1}
#flash{position:fixed;inset:0;opacity:0;transition:opacity .3s;pointer-events:none;z-index:45}
#flash.on{opacity:1}

/* ===== Phone app panel ===== */
.phgrid{display:flex;gap:14px;flex-wrap:wrap}
.phorders{flex:1 1 220px;min-width:200px}
.phapps{flex:1 1 300px}
.apps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.app{background:#fff;color:#1e293b;border:0;border-radius:12px;min-height:66px;font:inherit;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
.app i{font-style:normal;font-size:26px}
.app.lock{background:#a5adbb;opacity:.75;cursor:default}
.app .dot{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:grid;place-items:center}
.order{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:15px}
.order small{color:var(--muted)}
.empty{background:rgba(255,255,255,.06);border-radius:12px;padding:18px;text-align:center;margin-top:6px}
.empty small{display:block;color:var(--muted);margin-top:4px}
.phhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:20px;font-weight:900}


/* Gentle idle coach: appears only when the player pauses */
#idleRepairHint{position:absolute;z-index:80;left:50%;top:42%;transform:translate(-50%,-50%);max-width:min(86vw,420px);width:max-content;display:flex;align-items:center;gap:10px;padding:12px 16px;border:3px solid #ffe16b;border-radius:18px;background:rgba(27,22,43,.94);color:#fff5c4;font-weight:900;font-size:clamp(15px,3.7vw,20px);text-align:center;box-shadow:0 0 0 5px rgba(255,218,70,.22),0 12px 30px #0007;pointer-events:none;animation:coachPop .35s ease-out,coachGlow 1.2s ease-in-out infinite alternate}
#idleRepairHint .coachHand{font-size:34px;display:inline-block;animation:coachPoint .75s ease-in-out infinite alternate}
@keyframes coachPop{from{opacity:0;transform:translate(-50%,-42%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes coachGlow{from{box-shadow:0 0 0 3px #ffe16b33,0 12px 25px #0006}to{box-shadow:0 0 0 8px #ffe16b66,0 12px 30px #0008}}
@keyframes coachPoint{from{transform:translateY(-4px) rotate(-8deg)}to{transform:translateY(5px) rotate(8deg)}}

/* ===== Repair view (responsive grid) ===== */
#repair{position:fixed;inset:0;z-index:28;overflow:hidden;touch-action:none;direction:ltr;background-color:#d9a869;
  background-image:repeating-linear-gradient(94deg,rgba(255,255,255,.08) 0 6px,rgba(0,0,0,.05) 6px 9px,rgba(255,255,255,0) 9px 34px);
  display:grid;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px));
  grid-template-columns:minmax(0,27%) minmax(0,1fr) minmax(0,23%);
  grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"money head leave" "card phone new" "old phone new" "tools tools tools"}
.rp-left,.rp-right{display:contents}
.rp-head{grid-area:head;text-align:center;min-width:0;direction:rtl;pointer-events:none}
.rp-title{font-size:clamp(20px,5.2vmin,34px);font-weight:900;color:#fff;line-height:1.15;
  text-shadow:0 2px 0 #1b1030,2px 0 0 #1b1030,-2px 0 0 #1b1030,0 -2px 0 #1b1030,2px 2px 0 #1b1030,-2px -2px 0 #1b1030}
.rp-sub{display:inline-block;max-width:100%;background:rgba(20,16,40,.72);color:#ffe9a8;border-radius:10px;padding:3px 12px;font-size:clamp(12px,2.8vmin,16px);margin-top:4px}
.phcell{grid-area:phone;position:relative;min-width:0;min-height:0;overflow:hidden;border-radius:clamp(16px,4vmin,34px);background-color:#8fe3d3;
  background-image:linear-gradient(rgba(255,255,255,.5) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.5) 1.5px,transparent 1.5px);background-size:36px 36px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
#phoneWrap{position:absolute;left:50%;top:50%;width:50px;height:100px;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
#phoneWrap{perspective:900px;transform-style:preserve-3d}
#phoneWrap.phone-flipping{animation:phoneFlip3d .72s cubic-bezier(.2,.75,.25,1)}
@keyframes phoneFlip3d{0%{transform:translate(-50%,-50%) rotateY(0deg) scale(1)}45%{transform:translate(-50%,-50%) rotateY(90deg) scale(.92)}55%{transform:translate(-50%,-50%) rotateY(90deg) scale(.92)}100%{transform:translate(-50%,-50%) rotateY(180deg) scale(1)}}
#trayOld.screen-drop-target{border:2px dashed #fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.22),0 8px 18px rgba(0,0,0,.22);animation:targetPulse 1s ease-in-out infinite alternate}
@keyframes targetPulse{from{filter:brightness(1)}to{filter:brightness(1.22)}}
#oldItems .screen-target-hint{display:block;border:1px dashed #fbbf24;border-radius:8px;padding:7px 5px;color:#fff3c4;font-weight:800;text-align:center;font-size:12px;background:rgba(120,53,15,.35)}
#phoneSvg{width:100%;height:100%;display:block;overflow:visible;touch-action:none}
.rp-money{grid-area:money;align-self:center;justify-self:start;display:flex;align-items:center;gap:6px;font-size:clamp(20px,5vmin,28px);font-weight:900;color:#6df08a;-webkit-text-stroke:1px #0b3a18;text-shadow:0 2px 0 #0b3a18}
.rp-card{background:#fff;color:#334155;border:3px solid #2f6fd1;border-radius:12px;padding:8px 12px;font-size:14px}
.rp-card .nm{font-size:16px;font-weight:700}
.rp-card .qt{font-size:12px;color:#64748b;margin:2px 0 6px}
.rp-card .ck{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px;font-weight:700}
.rp-card .box{width:24px;height:24px;border:3px solid #1e293b;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:15px;background:#fff;flex:none}
.rp-card .box.on{background:#3dbb4a;border-color:#1f7a2a}
.rp-card .dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid #0003}
.rp-card .bonus{margin-top:6px;background:#3dbb4a;border:3px solid #0d3b14;border-radius:10px;color:#fff;font-weight:900;padding:4px 10px;display:flex;justify-content:space-between;direction:ltr;font-size:14px}
.tray{border-radius:14px;padding:8px;border:3px solid rgba(0,0,0,.12);position:relative;overflow:hidden;color:#6b5b6b;display:flex;flex-direction:column;gap:6px;min-height:70px}
.tray>span{font-size:13px;opacity:.6;text-align:center;font-weight:700}
.tray.old{background:#ffcfc0;border-color:#ef9a84;flex:1}
.tray.new{background:#f2f2f6;border-color:#d5d8e2;flex:1;align-items:center}
.tray .items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chip2{font-size:24px}
.item{display:flex;flex-direction:column;align-items:center;background:#fff;border:3px solid #4fd1c5;border-radius:14px;padding:8px 12px;cursor:grab;touch-action:none;color:#334155;font-weight:700;animation:bob 1.2s ease-in-out infinite}
.item .ico{font-size:clamp(30px,6vh,50px)}
.item small{font-size:12px}
.item.ghost{opacity:.3;animation:none}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0004;margin:4px;cursor:pointer}
#rpPop.go{animation:pop .7s ease-out}
.dragclone{position:fixed;z-index:60;pointer-events:none;font-size:52px;transform:translate(-50%,-60%);filter:drop-shadow(0 6px 6px #0006)}
.pulse{animation:pls 1s ease-in-out infinite}
.scanbeam{animation:scan .9s linear forwards}
@keyframes pls{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(344px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hintb{0%,100%{box-shadow:0 0 0 0 rgba(79,209,197,.0)}50%{box-shadow:0 0 0 6px rgba(79,209,197,.7)}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:1}40%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.3);opacity:0}}

#rpCard{grid-area:card;align-self:start}
#trayOld{grid-area:old}#trayNew{grid-area:new}
.tray{min-height:0;overflow:auto}
.rp-leave{grid-area:leave;justify-self:end;align-self:center;background:#ef4444;color:#fff;border:0;border-bottom:5px solid #a21d1d;border-radius:12px;font:inherit;font-weight:900;font-size:clamp(15px,3.6vmin,20px);padding:6px 16px;min-height:44px;cursor:pointer;text-shadow:0 1px 0 #7f1212;direction:rtl}
.rp-tools{grid-area:tools;display:flex;gap:6px;justify-content:center;direction:rtl;padding:2px}
.tool{flex:1 1 0;min-width:44px;max-width:92px;height:clamp(50px,11vmin,74px);background:#fff;color:#1e293b;border:3px solid #c3ccd8;border-radius:14px;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0 2px;direction:rtl}
.tool i{font-style:normal;font-size:clamp(20px,4.4vmin,30px);line-height:1.1}
.tool small{font-size:clamp(10px,2.4vmin,12px);font-weight:700;line-height:1.1;text-align:center}
.tool.on{border-color:#14b8a6;background:#d6fbf5}
.tool.glow{animation:hintb 1s ease-in-out infinite}
.rp-toast{position:absolute;grid-area:phone;top:8px;left:50%;transform:translateX(-50%);background:rgba(15,20,30,.92);color:#fff;border-radius:12px;padding:8px 14px;font-size:clamp(13px,3.2vmin,16px);font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5;max-width:94%;text-align:center;direction:rtl}
.rp-toast.show{opacity:1}
#rpPop{position:absolute;grid-area:phone;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(60px,18vmin,160px);pointer-events:none;color:#3dbb4a;text-shadow:0 4px 0 #0d3b14;z-index:3}
@media (max-aspect-ratio:1/1){
  #repair{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto auto;
    grid-template-areas:"money leave" "head head" "phone phone" "card new" "old new" "tools tools"}
  .rp-card .qt{display:none}
  .rp-card{padding:6px 10px}
  .tray.old{min-height:46px}
  .tray.new{min-height:112px}
}
@media (max-height:460px) and (min-aspect-ratio:1/1){
  .rp-card .qt{display:none}.rp-card{padding:5px 8px}.rp-card .ck{margin:2px 0}.rp-card .nm{font-size:14px}
  .tray>span{font-size:11px}.item{padding:4px 8px}.tool{height:50px}.tool i{font-size:20px}
}

/* ===== Responsive HUD (all devices) ===== */
:root{--joy:clamp(100px,26vmin,150px);--sx:max(12px,env(safe-area-inset-left,0px));--ex:max(12px,env(safe-area-inset-right,0px));--sb:max(14px,env(safe-area-inset-bottom,0px));--xpb:var(--sb)}
@media (max-aspect-ratio:1/1){:root{--xpb:calc(var(--sb) + var(--joy) + 12px)}}
.topbar{top:calc(env(safe-area-inset-top,0px) + 8px);left:var(--sx);right:var(--ex);flex-wrap:nowrap;gap:6px}
.chip{font-size:clamp(13px,3.6vmin,17px);padding:6px 10px;white-space:nowrap}
.info{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);left:calc(var(--sx) + 80px);right:var(--ex);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.info .hint,.info .orders{position:static;transform:none;max-width:100%;width:auto;font-size:clamp(12px,3.2vmin,15px)}
.info .orders{align-self:flex-end;text-align:right}
.side{left:var(--sx);top:calc(env(safe-area-inset-top,0px) + 56px)}
.sidebtn{min-width:60px;font-size:clamp(20px,5.5vmin,28px)}
.toast{top:calc(env(safe-area-inset-top,0px) + 128px);max-width:92vw;white-space:normal;text-align:center}
.joy{left:var(--sx);bottom:var(--sb);width:var(--joy);height:var(--joy)}
.knob{width:calc(var(--joy)*.42);height:calc(var(--joy)*.42);margin:calc(var(--joy)*-.21) 0 0 calc(var(--joy)*-.21)}
.actions{right:var(--ex);bottom:var(--sb);width:clamp(150px,40vmin,200px)}
.actions .btn{min-height:clamp(44px,9vmin,56px);font-size:clamp(14px,3.8vmin,18px);padding:6px}
.xp{bottom:var(--xpb);width:min(34vw,360px)}
.lvl{width:clamp(44px,10vmin,56px);height:clamp(44px,10vmin,56px);font-size:clamp(18px,4.6vmin,24px)}
@media (max-aspect-ratio:1/1){.xp{width:min(78vw,380px)}}
.canbuy{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--xpb) + 62px);color:#6df08a;font-weight:900;font-size:clamp(14px,3.6vmin,18px);white-space:nowrap;-webkit-text-stroke:.6px #0b3a18;text-shadow:0 2px 0 #0b3a18}
.canbuy:empty{display:none}
.prompt{bottom:calc(var(--xpb) + 100px);max-width:92vw;white-space:normal;text-align:center}

.rpd.hold{z-index:3;left:calc(77% - 2.2vmin);top:28%;width:4.4vmin;padding:1vmin 0;background:#2b3050;border-radius:1.2vmin;display:flex;flex-direction:column;gap:1vmin;align-items:center}

/* ===== 3D bench ===== */
#repair{display:block;overflow:hidden}
.rp-stage{position:absolute;inset:0;perspective:900px;perspective-origin:50% 35%;overflow:hidden}
.rp-wood{position:absolute;left:-60%;right:-60%;top:-120%;bottom:0;transform-origin:50% 100%;transform:rotateX(34deg);background-color:#dca96b;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 14px,rgba(0,0,0,.08) 14px 20px,rgba(255,255,255,0) 20px 70px)}
.rp-plane{position:absolute;left:2%;right:2%;top:8%;bottom:2%;transform-origin:50% 100%;transform:rotateX(34deg);transform-style:preserve-3d;display:grid;grid-template-columns:27% 1fr 23%;column-gap:3%;align-items:stretch}
.rp-plane>.phcell{grid-area:auto;grid-column:2;grid-row:1;transform:translateZ(6px);clip-path:none;box-shadow:0 10px 0 #5aa89b,0 18px 22px rgba(0,0,0,.35)}
.rp-plane>#trayOld{grid-area:auto;grid-column:1;grid-row:1;align-self:end;height:62%;transform:translateZ(10px);clip-path:none;box-shadow:0 8px 0 #d98b77,0 16px 20px rgba(0,0,0,.3)}
.rp-plane>#trayNew{grid-area:auto;grid-column:3;grid-row:1;align-self:end;height:78%;transform:translateZ(10px);clip-path:none;box-shadow:0 8px 0 #c9ccd8,0 16px 20px rgba(0,0,0,.3)}
.rpd{position:absolute;pointer-events:none}
.rpd.hold{left:73%;top:22%;width:4.6%;height:30%;background:#2b3050;border-radius:14px;transform:translateZ(22px);box-shadow:0 8px 0 #171a30;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:6px 0}
.rpd.hold i{width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#05070f 55%,#3c4270 60%)}
.rpd.note{left:90%;top:34%;width:8%;height:9%;background:#ffe98a;transform:translateZ(14px) rotate(8deg);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.rpd.mug{left:85%;top:-2%;width:9%;height:13%;transform-origin:50% 100%;transform:translateZ(8px) rotateX(-34deg)}
.rpd.mug b{position:absolute;inset:18% 0 0;background:linear-gradient(90deg,#43c9b8,#8ef0e2 40%,#33a898);border-radius:8% 8% 40% 40%}
.rpd.mug b::before{content:"";position:absolute;left:0;right:0;top:-18%;height:36%;border-radius:50%;background:#7a4524;border:.5vmin solid #5fe0d0}
.rpd.mug b::after{content:"";position:absolute;left:-30%;top:25%;width:35%;height:40%;border:.8vmin solid #43c9b8;border-right:0;border-radius:40% 0 0 40%}
.cm{position:absolute;width:0;height:0;pointer-events:none}

#whDisc span{position:absolute;left:50%;top:50%;margin:-11px 0 0 -34px;width:68px;text-align:center;font-weight:900;font-size:clamp(9px,calc(var(--r) * .058),14px);color:#1b2230;white-space:nowrap;transform-origin:50% 50%}
@media (max-aspect-ratio:1/1){.info .hint{font-size:clamp(15px,4.4vmin,22px);-webkit-text-stroke:4px #0b1020}}
</style>

// ===== Helpers =====
function clampNum(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function pad2(n) { return String(n).padStart(2, '0'); }
function formatTime(minutes) {
  const m = clampNum(Math.floor(minutes), 0, DAY_END - 1);
  return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
}
function isShopOpen(minutes) { return minutes >= SHOP_OPEN && minutes < SHOP_CLOSE; }
function daylightAt(minutes) {
  const t = minutes / DAY_END;
  return Math.max(0, Math.sin((t - 0.25) * Math.PI * 2));
}
function levelOf(xp) { return 1 + Math.floor(xp / 100); }
function round1(n) { return Math.round(n * 10) / 10; }
function elapsedMinutes(start, now) { return Math.max(0, now - start); }
function lerpAngle(a, b, t) {
  const d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  return a + d * t;
}

function resolveBoxes(p, r) {
  for (const b of OBSTACLES) {
    const cx = clampNum(p.x, b.minX, b.maxX);
    const cz = clampNum(p.z, b.minZ, b.maxZ);
    const dx = p.x - cx, dz = p.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) {
      const d = Math.sqrt(d2);
      const push = (r - d) / d;
      p.x += dx * push;
      p.z += dz * push;
    } else {
      const left = p.x - b.minX, right = b.maxX - p.x;
      const up = p.z - b.minZ, down = b.maxZ - p.z;
      const m = Math.min(left, right, up, down);
      if (m === left) p.x = b.minX - r;
      else if (m === right) p.x = b.maxX + r;
      else if (m === up) p.z = b.minZ - r;
      else p.z = b.maxZ + r;
    }
  }

  // Cars are solid: resolve player overlap against parked and visible moving vehicles.
  for (const v of allVehicles) {
    if (!v.group || !v.group.visible) continue;
    const vx = v.group.position.x, vz = v.group.position.z;
    if (Math.abs(p.x - vx) > 2.5 + r || Math.abs(p.z - vz) > 1.25 + r) continue;
    const minX = vx - 2.1, maxX = vx + 2.1, minZ = vz - 0.95, maxZ = vz + 0.95;
    const cx = clampNum(p.x, minX, maxX), cz = clampNum(p.z, minZ, maxZ);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) {
      const d = Math.sqrt(d2), push = (r - d) / d;
      p.x += dx * push; p.z += dz * push;
    } else {
      const gaps = [Math.abs(p.x-minX), Math.abs(maxX-p.x), Math.abs(p.z-minZ), Math.abs(maxZ-p.z)];
      const m = Math.min(...gaps);
      if (m === gaps[0]) p.x = minX-r;
      else if (m === gaps[1]) p.x = maxX+r;
      else if (m === gaps[2]) p.z = minZ-r;
      else p.z = maxZ+r;
    }
  }

}

  let bonus = 0;
  for (const id of Object.keys(state.upgrades)) {

// ===== Repair jobs =====
function createRepairJob(model, fault, allowed, tutorial, startMinute, order) {
  const f = FAULTS[fault];
  const steps = tutorial ? f.steps.slice() : f.steps.concat([CASE_STEP]);
  return {
    model: model, fault: fault, steps: steps, stepIndex: 0, mistakes: 0, allowed: allowed,
    failed: false, tutorial: !!tutorial, delivered: false, abandoned: false, recorded: false,
    startMinute: startMinute, due: f.minutes, price: 0, visual: null, order: order || null,
    view: (fault === 'screen' || fault === 'boot') ? 'front' : 'back',
    v: {
      scr: fault === 'screen' ? 'cracked' : (fault === 'boot' ? 'off' : 'ok'),
      shards: [true, true, true, true, true, true, true, true],
      film: 1, clean: false, protector: false, covered: true, shieldCovered: false,
      screws: [true, true, true, true], part: 'old', caseColor: null
    },
    old: [], sd: null, sdIndex: -1, partUsed: false
  };
}
function jobFinished(job) { return job.failed || job.stepIndex >= job.steps.length; }
function jobSucceeded(job) { return !job.failed && job.stepIndex >= job.steps.length; }
function currentStep(job) { return job.steps[job.stepIndex] || null; }
function advanceStep(job) {
  if (jobFinished(job)) return 'ignored';
  job.stepIndex++;
  return job.stepIndex >= job.steps.length ? 'completed' : 'advanced';
}
function registerMistake(job) {
  if (jobFinished(job)) return 'ignored';
  job.mistakes++;
  if (job.mistakes >= job.allowed) {
    job.failed = true;
    return 'failed';
  }
  return 'wrongTool';
}

function finishRepair(state, job, nowMinute) {
  if (job.recorded) return null;
  job.recorded = true;
  const success = jobSucceeded(job);
  const onTime = success && elapsedMinutes(job.startMinute, nowMinute) <= job.due;
  const ratio = elapsedMinutes(job.startMinute, nowMinute) / job.due;
  const rating = !success ? 1 : (ratio <= 0.7 ? 5 : (ratio <= 1 ? 4 : 3));
  job.rating = rating;
  state.today.ratings.push(rating);
  state.ratings.push(rating);
  while (state.ratings.length > MAX_RATINGS) state.ratings.shift();
  if (success) {
    const xp = FAULTS[job.fault].xp;
    state.xp += xp;
    state.today.xpGained += xp;
    state.today.success++;
  } else {
    state.today.failed++;
  }
  return { success: success, onTime: onTime, rating: rating };
}

// ===== Economy =====
function effectivePrice(state, faultId, model) {
  const base = state.prices[faultId] !== undefined ? state.prices[faultId] : FAULTS[faultId].price;
  return Math.round(base * model.mult);
}
function adjustPrice(state, faultId, delta) {
  const cur = state.prices[faultId] !== undefined ? state.prices[faultId] : FAULTS[faultId].price;
  state.prices[faultId] = clampNum(cur + delta, PRICE_MIN, PRICE_MAX);
}
function addIncome(state, amount) {
  state.money += amount;
  state.today.income += amount;
}
function spend(state, amount) {
  state.money -= amount;
  state.today.expenses += amount;
}
function partCost(state, partId) { return Math.round(PARTS[partId].cost * (state.zones && state.zones.parts ? 0.8 : 1)); }
function buyPart(state, partId) {
  const p = PARTS[partId];
  if (!p || state.money < partCost(state, partId)) return false;
  spend(state, partCost(state, partId));
  state.inv[partId] = (state.inv[partId] || 0) + 1;
  return true;
}
function usePart(state, partId) {
  if (!state.inv[partId]) return false;
  state.inv[partId]--;
  return true;
}
function buyUpgrade(state, upId) {
  const u = UPGRADES[upId];
  if (!u || state.upgrades[upId] || levelOf(state.xp) < u.reqLevel || state.money < u.cost) return false;
  spend(state, u.cost);
  state.upgrades[upId] = true;
  return true;
}
function averageRating(state) {
  if (state.ratings.length === 0) return 3;
  return state.ratings.reduce((a, b) => a + b, 0) / state.ratings.length;
}

// ===== Books and skills =====
function canReadBook(state, book) {
  return !state.booksRead.includes(book.id) && levelOf(state.xp) >= (book.reqLevel || 1);
}
function readBook(state, book) {
  if (!canReadBook(state, book)) return false;
  state.booksRead.push(book.id);
  for (const s of book.skills) {
    if (!state.skills.includes(s)) state.skills.push(s);
  }
  return true;
}
function mandatoryBooksDone(state) {
  return BOOKS.filter(b => b.mandatory).every(b => state.booksRead.includes(b.id));
}
function hasSkill(state, faultId) { return state.skills.includes(FAULTS[faultId].skill); }
function unlockedFaults(state) { return Object.keys(FAULTS).filter(f => hasSkill(state, f)); }

function makeOrder(state, rnd) {
  const faults = unlockedFaults(state);
  if (faults.length === 0) return null;
  const fault = faults[Math.floor(rnd() * faults.length)];
  const model = MODELS[Math.floor(rnd() * MODELS.length)];
  const cs = CASES[Math.floor(rnd() * CASES.length)];
  return {
    fault: fault, model: model, price: effectivePrice(state, fault, model), due: FAULTS[fault].minutes,
    caseId: cs.id, name: NAMES[Math.floor(rnd() * NAMES.length)], quote: QUOTES[Math.floor(rnd() * QUOTES.length)]
  };
}

  { id: 'books', name: 'اقرأ كتابًا جديدًا من الرف', reward: 20, done: s => s.booksRead.length > MANDATORY_IDS.length },
  { id: 'own', name: 'أصلح هاتفك المكسور', reward: 30, done: s => s.tutorialDone },
  { id: 'serve3', name: 'سلّم 3 هواتف مصلحة للزبائن', reward: 40, done: s => (s.totalServed || 0) >= 3 },
  { id: 'lvl3', name: 'اصل إلى المستوى 3', reward: 50, done: s => levelOf(s.xp) >= 3 },
  { id: 'upgrade', name: 'اشترِ ترقية واحدة', reward: 30, done: s => Object.keys(s.upgrades).some(k => s.upgrades[k]) }
];
function claimTask(state, id) {
  const t = TASKS.find(x => x.id === id);
  if (!t || state.tasksDone.includes(id) || !t.done(state)) return false;
  state.tasksDone.push(id);
  addIncome(state, t.reward);
  return true;
}
function claimGift(state) {
  if (state.giftDay === state.day) return false;
  state.giftDay = state.day;
  addIncome(state, GIFT_AMOUNT);
  return true;
}

// ===== Day end =====
function closeDay(state) {
  const t = state.today;
  const entry = {
    day: state.day, income: t.income, expenses: t.expenses, profit: t.income - t.expenses,
    success: t.success, failed: t.failed, served: t.served, left: t.left, xpGained: t.xpGained,
    balance: state.money,
    avgRating: t.ratings.length ? round1(t.ratings.reduce((a, b) => a + b, 0) / t.ratings.length) : 0
  };
  state.history.unshift(entry);
  if (state.history.length > MAX_HISTORY) state.history.length = MAX_HISTORY;
  state.today = newDayStats();
  state.day++;
  state.minutes = DAY_START;
  return entry;
}

// ===== Save format =====
function isValidState(d) {
  return !!d && typeof d === 'object' && d.version === SAVE_VERSION &&
    [d.money, d.xp, d.day, d.minutes].every(v => Number.isFinite(v)) &&
    Array.isArray(d.skills) && Array.isArray(d.booksRead) && Array.isArray(d.history) &&
    !!d.player && Number.isFinite(d.player.x) && Number.isFinite(d.player.z);
}

  return JSON.stringify(Object.assign({}, state, { savedAt: savedAt }));
}

  if (typeof text !== 'string' || text.length === 0) return null;
  try {
    const d = JSON.parse(text);
    return isValidState(d) ? d : null;
  } catch (e) {
    return null;
  }
}
function restoreState(parsed) {
  const s = Object.assign(newGameState(), parsed);
  if (!s.today || !Array.isArray(s.today.ratings)) s.today = newDayStats();
  if (!s.inv) s.inv = {};
  if (!s.upgrades) s.upgrades = {};
  if (!s.prices) s.prices = {};
  if (!Array.isArray(s.ratings)) s.ratings = [];
  if (!Array.isArray(s.tasksDone)) s.tasksDone = [];
  if (!s.zones || typeof s.zones !== 'object') s.zones = {};
  for (const id of BASE_SKILLS) if (!s.skills.includes(id)) s.skills.push(id);
  for (const id of MANDATORY_IDS) if (!s.booksRead.includes(id)) s.booksRead.push(id);
  if (s.tutorialDone && s.minutes < SHOP_OPEN) s.minutes = SHOP_OPEN;
  s.player = {
    x: parsed.player.x, z: parsed.player.z, face: Number(parsed.player.face) || 0,
    y: 0, vy: 0, speed: 0
  };
  return s;
}

// ===== Text planes (signs / labels) =====
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function textPlane(w, h, draw, px) {
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * px); cv.height = Math.round(h * px);
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  mesh.userData.redraw = function () {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    c.direction = 'rtl';
    draw(c, cv.width, cv.height);
    tex.needsUpdate = true;
  };
  mesh.userData.redraw();
  textPlanes.push(mesh);
  return mesh;
}

let traffic = { times: [], idx: 0 };
function planTraffic() {
  const n = 1 + (Math.random() < 0.5 ? 1 : 0);
  const from = Math.max(G.minutes + 20, SHOP_OPEN + 20);
  const span = Math.max(40, DAY_END - 90 - from);
  const ts = [];
  for (let i = 0; i < n; i++) ts.push(from + Math.random() * span);
  ts.sort((a, b) => a - b);
  traffic = { times: ts, idx: 0 };
  for (const c of cars) { c.active = false; c.group.visible = false; }
}
function trafficTick() {
  while (traffic.idx < traffic.times.length && G.minutes >= traffic.times[traffic.idx]) {
    traffic.idx++;
    const c = cars.find(x => !x.active);
    if (c) { c.active = true; c.x = c.dir > 0 ? -48 : 48; c.group.visible = true; }
  }
}

function drawZoneLabel(c, w, h, z) {

function buildZones() {
  for (const z of ZONES) {
    z.group = z.build();
    const pad = new THREE.Group();
    z.ring = part(new THREE.CylinderGeometry(0.8, 0.8, 0.05, 28), 0x2ecc71, pad, 0, 0.03, 0, { noShadow: true });
    part(new THREE.CylinderGeometry(0.6, 0.6, 0.06, 28), 0x1d9b52, pad, 0, 0.04, 0, { noShadow: true });
    z.label = textPlane(2.6, 1.0, (c, w, h) => drawZoneLabel(c, w, h, z), 100);
    z.label.position.set(0, 1.35, 0);
    pad.add(z.label);
    pad.position.set(z.x, 0, z.z);
    scene.add(pad);
    z.pad = pad;
    z.cd = 0;
  }
  guideArrow = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: 0xffd23f });
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.6, 4), mat);
  cone.rotation.x = Math.PI; cone.position.y = 0.3;
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.5, 0.22), mat);
  shaft.position.y = 0.85;
  guideArrow.add(cone, shaft);
  guideArrow.scale.setScalar(0.7);
  guideArrow.visible = false;
  scene.add(guideArrow);
  syncZones();
}

function syncZones() {
  for (const z of ZONES) {
    if (!z.group) continue;
    const owned = !!(G.zones && G.zones[z.id]);
    z.group.visible = owned;
    z.group.scale.setScalar(1);
    z.pad.visible = !owned && !!G.tutorialDone;
    const i = OBSTACLES.indexOf(z.box);
    if (owned && i < 0) OBSTACLES.push(z.box);
    if (!owned && i >= 0) OBSTACLES.splice(i, 1);
    z.label.userData.key = '';
  }
}

function nextZone() {
  if (!G.tutorialDone) return null;
  for (const z of ZONES) {
    if (!G.zones[z.id] && levelOf(G.xp) >= z.reqLevel) return z;
  }
  return null;
}

function buyZone(z) {
  spend(G, z.cost);
  G.zones[z.id] = true;
  syncZones();
  z.group.scale.setScalar(0.05);
  z.pop = 0;
  sfx('cash');
  flash('rgba(123,216,143,.3)', 300);
  toast('اشتريت: ' + z.name + ' · ' + z.info);
  autosaveNow();
}

let zoneTime = 0;
function updateZones(dt) {
  if (!guideArrow) return;
  zoneTime += dt;
  const gz = nextZone();
  for (const z of ZONES) {
    if (z.pop !== undefined && z.pop < 1) {
      z.pop = Math.min(1, z.pop + dt * 2.5);
      z.group.scale.setScalar(0.05 + 0.95 * (1 - Math.pow(1 - z.pop, 3)));
    }
    z.cd = Math.max(0, z.cd - dt);
    const owned = !!G.zones[z.id];
    z.pad.visible = !owned && !!G.tutorialDone;
    if (!z.pad.visible) continue;
    const locked = levelOf(G.xp) < z.reqLevel;
    const afford = G.money >= z.cost;
    const key = locked + '|' + afford;
    if (z.label.userData.key !== key) {
      z.label.userData.key = key;
      z.label.userData.redraw();
      z.ring.material.color.set(locked ? 0x7a8594 : (afford ? 0x2ecc71 : 0xd9a441));
    }
    z.label.quaternion.copy(camera.quaternion);
    const s = 1 + Math.sin(zoneTime * 3) * 0.04;
    z.ring.scale.set(s, 1, s);
    if (mode === 'play' && openPanel === null) {
      const d = Math.hypot(G.player.x - z.x, G.player.z - z.z);
      if (d < 0.8 && G.player.y < 0.5) {
        if (!locked && afford) buyZone(z);
        else if (z.cd <= 0) { z.cd = 2.5; toast(locked ? 'يتطلب المستوى ' + z.reqLevel : 'تحتاج $' + z.cost + ' لشراء ' + z.name); }
      }
    }
  }
  if (gz && gz.pad.visible && mode === 'play') {
    guideArrow.visible = true;
    guideArrow.position.set(gz.x, 1.95 + Math.sin(zoneTime * 3.5) * 0.12, gz.z);
    guideArrow.rotation.y += dt * 1.5;
  } else guideArrow.visible = false;
}

// Applies the chosen case color and removes the cracks once the screen is fixed.
function refreshPhoneMesh(job) {
  const vis = job.visual;
  if (!vis) return;
  if (job.v.caseColor && vis.children[0] && vis.children[0].material) vis.children[0].material.color.set(job.v.caseColor);
  if (jobSucceeded(job) && job.fault === 'screen') {
    for (let i = vis.children.length - 1; i >= 2; i--) vis.remove(vis.children[i]);
    if (vis.children[1] && vis.children[1].material) {
      vis.children[1].material.color.set(0x1d3a8a);
      vis.children[1].material.emissive.set(0x2a4fb0);
    }
  }
}

// ===== Layout rules =====
function clampLayout(p) {
  const doorOpen = mandatoryBooksDone(G);
  if (p.z > ROOM.maxZ) {
    if (p.z > 4.6) streetOut = true;
    if (Math.abs(p.x) > DOORWAY_HALF) p.z = streetOut ? clampNum(p.z, 4.2, OUTSIDE_MAX_Z) : ROOM.maxZ;
    else p.z = Math.min(p.z, OUTSIDE_MAX_Z);
    p.x = clampNum(p.x, -OUTSIDE_HALF_X, OUTSIDE_HALF_X);
    return;
  }
  streetOut = false;
  p.z = clampNum(p.z, ROOM.minZ, ROOM.maxZ);
  if (Math.abs(p.z) <= DOORWAY_HALF && doorOpen) {
    p.x = clampNum(p.x, BED_ROOM.minX, ROOM.maxX);
  } else if (p.x < -5.0) {
    p.x = clampNum(p.x, BED_ROOM.minX, BED_ROOM.maxX);
  } else {
    p.x = clampNum(p.x, ROOM.minX, ROOM.maxX);
  }
}

    return upcoming ? 'مكتب التعلّم · الدرس القادم بالمستوى ' + upcoming.reqLevel : 'مكتب التعلّم · راجع مكتبتك';
  },

    const next = BOOKS.find(b => !b.mandatory && !G.booksRead.includes(b.id) && levelOf(G.xp) >= (b.reqLevel || 1));
    if (next) { startReading(next); return; }
    const upcoming = BOOKS.filter(b => !b.mandatory && !G.booksRead.includes(b.id)).sort((a,b) => (a.reqLevel || 1) - (b.reqLevel || 1))[0];
    toast(upcoming ? 'الدرس القادم يفتح في المستوى ' + upcoming.reqLevel : 'أحسنت! أكملت كل الدروس المتاحة حالياً');

};

// ===== Customers =====
class Customer {
  constructor(order, slotIndex) {
    this.order = order;
    this.model = order.model;
    this.slotIndex = slotIndex;
    this.slot = QUEUE_SLOTS[slotIndex];
    this.x = OUTSIDE.x;
    this.z = OUTSIDE.z;
    this.path = [DOOR, this.slot];
    this.phase = 'arriving';
    this.patience = PICKUP_PATIENCE * patienceMult();
    this.job = null;
    this.speed = 0;
    this.rig = makeCharacter(SHIRTS[Math.floor(Math.random() * SHIRTS.length)]);
    this.mesh = this.rig.group;
    this.mesh.position.set(this.x, 0, this.z);
    scene.add(this.mesh);
  }

  walk(dt) {
    if (this.path.length === 0) {
      this.speed = 0;
      return true;
    }
    const t = this.path[0];
    const dx = t.x - this.x, dz = t.z - this.z;
    const d = Math.hypot(dx, dz);
    const step = CUSTOMER_SPEED * dt;
    if (d > 1e-3) this.mesh.rotation.y = Math.atan2(dx, dz);
    this.speed = CUSTOMER_SPEED;
    if (d <= step) {
      this.x = t.x;
      this.z = t.z;
      this.path.shift();
      if (this.path.length === 0) this.speed = 0;
      return this.path.length === 0;
    }
    this.x += (dx / d) * step;
    this.z += (dz / d) * step;
    return false;
  }

  update(dt) {
    if (this.phase === 'arriving') {
      if (this.walk(dt)) this.phase = 'waitPhone';
    } else if (this.phase === 'waitPhone' || this.phase === 'waitRepair') {
      this.speed = 0;
      this.patience -= dt;
      if (this.patience <= 0) this.leave(false);
    } else if (this.phase === 'leaving') {
      if (this.walk(dt)) this.remove();
    }
    this.mesh.position.set(this.x, 0, this.z);
    animateWalk(this.rig, this.speed, dt);
  }

  getPrompt() {
    if (this.phase === 'waitPhone' && !carried && !bench.job) return this.accepted ? 'خذ الهاتف' : 'اسمع طلب الزبون';
    if (this.phase === 'waitRepair' && this.job && carried === this.job && jobFinished(this.job)) {
      return 'سلّم الهاتف للزبون';
    }
    return null;
  }

  interact() {
    if (this.phase === 'waitPhone' && !carried && !bench.job && !this.accepted) { showRequest(this); return; }
    if (this.phase === 'waitPhone' && !carried && !bench.job) {
      const job = createRepairJob(this.order.model, this.order.fault, allowedMistakes(G), false, null, this.order);
      job.price = this.order.price;
      job.visual = makePhoneMesh(this.order.model, this.order.fault === 'screen');
      this.job = job;
      carry(job);
      this.phase = 'waitRepair';
      this.patience = REPAIR_PATIENCE * patienceMult();
      toast('خذ الهاتف إلى طاولة الإصلاح');
      sfx('click');
      return;
    }

    if (this.phase === 'waitRepair' && carried === this.job && jobFinished(this.job)) {
      if (jobSucceeded(this.job)) {
        addIncome(G, incomeMult(this.job.price));
        if (G.zones && G.zones.bags) addIncome(G, 5);
        if (G.zones && G.zones.boxes) addIncome(G, 3);
        if (G.zones && G.zones.coffee) { G.xp += 5; G.today.xpGained += 5; }
        G.totalServed = (G.totalServed || 0) + 1;
        sfx('cash');
      }
      G.today.served++;
      this.job.delivered = true;
      toast(this.order.name + ': ' + starText(this.job.rating || 3));
      releaseCarried();
      this.leave(true);
    }
  }

  leave(delivered) {
    if (this.phase === 'leaving' || this.phase === 'gone') return;
    if (!delivered) {
      G.today.left++;
      if (this.job && !this.job.delivered) {
        this.job.abandoned = true;
        if (carried === this.job) releaseCarried();
      }
    }
    slotsUsed[this.slotIndex] = false;
    this.phase = 'leaving';
    this.path = [DOOR, OUTSIDE];
  }

  remove() {
    this.phase = 'gone';
    scene.remove(this.mesh);
  }
}

function patienceMult() { return G.zones && G.zones.lounge ? 1.5 : 1; }

function spawnCustomer() {
  const idx = slotsUsed.findIndex(u => !u);
  if (idx < 0) return;
  const order = makeOrder(G, Math.random);
  if (!order) return;
  slotsUsed[idx] = true;
  customers.push(new Customer(order, idx));
}

function spawnInterval() {
  return clampNum(55 - (averageRating(G) - 3) * 8, 25, 70) * (G.zones && G.zones.sign ? 0.8 : 1);
}

function updateCustomers(dt) {
  if (G.tutorialDone && isShopOpen(G.minutes)) {
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval()) {
      spawnTimer = 0;
      spawnCustomer();
    }
  }
  for (const c of customers) c.update(dt);
  customers = customers.filter(c => c.phase !== 'gone');
}

function allInteractables() {
  const list = [bench, FLOOR_PHONE_OBJ, BED_OBJ, COMPUTER_OBJ, LEDGER_OBJ, TRAINING_DESK_OBJ].concat(SHOP_OBJS);
  for (const s of BOOK_SPOTS) list.push(s);
  for (const c of customers) list.push(c);
  return list;
}

function nearestUsable() {
  let best = null;
  let bestDistance = Infinity;
  for (const it of allInteractables()) {
    const d = Math.hypot(it.x - G.player.x, it.z - G.player.z);
    if (d > (it.range || INTERACT_RANGE) || d >= bestDistance) continue;
    if (!it.getPrompt()) continue;
    bestDistance = d;
    best = it;
  }
  return best;
}

function interact() {
  if (mode !== 'play' || openPanel !== null) return;
  const target = nearestUsable();
  if (target) target.interact();
}

// ===== Player movement =====
function readMove() {
  let x = input.joy.x, y = input.joy.y;
  const k = input.keys;
  if (k.has('KeyW') || k.has('ArrowUp')) y += 1;
  if (k.has('KeyS') || k.has('ArrowDown')) y -= 1;
  if (k.has('KeyD') || k.has('ArrowRight')) x += 1;
  if (k.has('KeyA') || k.has('ArrowLeft')) x -= 1;
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  return { x: x, y: y };
}

function updatePlayer(dt) {
  const n = Math.max(1, Math.ceil(dt / 0.034));
  for (let i = 0; i < n; i++) updatePlayerStep(dt / n);
}
function updatePlayerStep(dt) {
  const p = G.player;
  const m = readMove();
  const sprint = input.sprintTouch || input.keys.has('ShiftLeft') || input.keys.has('ShiftRight');
  const mag = Math.min(1, Math.hypot(m.x, m.y));
  const speed = (sprint ? RUN_SPEED : WALK_SPEED) * (0.6 + 0.4 * mag);

  const s = Math.sin(camState.yaw), c = Math.cos(camState.yaw);
  const mx = c * m.x - s * m.y;
  const mz = -s * m.x - c * m.y;
  const moving = mx * mx + mz * mz > 0.0001;
  p.speed = moving ? speed : 0;
  if (moving) {
    p.x += mx * speed * dt;
    p.z += mz * speed * dt;
    p.face = lerpAngle(p.face, Math.atan2(mx, mz), Math.min(1, 16 * dt));
  }
  clampLayout(p);
  resolveBoxes(p, PLAYER_RADIUS);
  clampLayout(p);

  if (input.jumpQueued && p.y <= 0.001) p.vy = 6.2;
  input.jumpQueued = false;
  p.vy -= 18 * dt;
  p.y += p.vy * dt;
  if (p.y < 0) { p.y = 0; p.vy = 0; }
}

function syncPlayerVisual(dt) {
  const p = G.player;
  playerRig.group.position.set(p.x, p.y, p.z);
  playerRig.group.rotation.y = p.face;
  animateWalk(playerRig, p.speed || 0, dt);
  if (readFx) {
    playerRig.armL.rotation.x = -1.2;
    playerRig.armR.rotation.x = -1.2 + Math.sin(readFx.t * 3) * 0.12;
  }
}

// ===== Camera =====
const camTarget = new THREE.Vector3();
const camDesired = new THREE.Vector3();

function updateCamera(dt) {
  const k = 1 - Math.exp(-10 * dt);
  if (cameraMode === 'play') {
    const p = G.player;
    const cp = Math.cos(camState.pitch), sp = Math.sin(camState.pitch), d = camState.distance;
    camTarget.set(p.x, p.y + 1.3, p.z);
    camDesired.set(
      p.x + Math.sin(camState.yaw) * cp * d,
      p.y + 1.3 + sp * d,
      p.z + Math.cos(camState.yaw) * cp * d
    );
    if (p.z > 19.7) { const sh = SHOPS.find(q => p.x > q.xa && p.x < q.xb); if (sh) { camDesired.x = clampNum(camDesired.x, sh.xa + 0.4, sh.xb - 0.4); camDesired.z = Math.min(camDesired.z, 31.0); camDesired.y = Math.min(camDesired.y, 3.3); } }
  } else if (cameraMode === 'orbit') {
    const p = G.player;
    const a = cine ? cine.t * 0.35 + 0.5 : 0.5;
    camTarget.set(p.x, 1.2, p.z);
    camDesired.set(p.x + Math.cos(a) * 3.2, 2.0, p.z + Math.sin(a) * 3.2);
  } else if (cameraMode === 'read' && readFx) {
    const p = G.player;
    const a = Math.sin(readFx.t * 0.5) * 0.9;
    if (readFx.eu !== undefined) { eurekaCam(p); } else if (readFx.cam === 'desk') {
      camTarget.set(p.x, 1.2, p.z + 0.5);
      camDesired.set(p.x + Math.sin(a) * 1.8, 1.9, p.z - 2.4);
    } else {
      camTarget.set(p.x, 1.3, p.z);
      camDesired.set(p.x + Math.cos(a) * 2.5, 1.7, p.z + Math.sin(a) * 1.8);
    }
  } else {
    camTarget.set(FLOOR_PHONE.x, 0.05, FLOOR_PHONE.z);
    camDesired.set(FLOOR_PHONE.x + 0.6, 0.9, FLOOR_PHONE.z + 0.9);
  }
  if (shake > 0) {
    camDesired.x += (Math.random() - 0.5) * shake;
    camDesired.y += (Math.random() - 0.5) * shake;
    shake = Math.max(0, shake - dt * 2);
  }
  camera.position.lerp(camDesired, k);
  camera.lookAt(camTarget);
}

// ===== Lighting and world life =====
function updateLighting() {
  const d = readFx ? readFx.d : daylightAt(G.minutes);
  hemi.intensity = 0.3 + 0.55 * d + (hemi.userData.boost || 0);
  sun.intensity = 0.05 + 0.95 * d;
  const a = (G.minutes / DAY_END - 0.25) * Math.PI * 2;
  sun.position.set(Math.cos(a) * 14, Math.max(Math.sin(a) * 14, 2.5), 7);
  skyTmp.lerpColors(NIGHT_SKY, DAY_SKY, d);
  scene.background.copy(skyTmp);
  shopLight.intensity = (1 - d) * 1.0;
  bedLight.intensity = (1 - d) * 0.9;
  for (const l of streetLights) l.intensity = l.allowed ? (1 - d) * 1.4 : 0;
  for (const wm of windowMats) wm.emissiveIntensity = (1 - d) * 0.9;
  for (const m of skyPanes) m.color.copy(skyTmp);
}

function updateWorldLife(dt) {
  tickBots(dt);
  const q = QUALITY[settings.quality] || QUALITY.medium;
  for (const car of cars) {
    if (!car.active) continue;
    car.x += car.dir * car.speed * dt;
    if (Math.abs(car.x) > 49) { car.active = false; car.group.visible = false; continue; }
    car.group.position.set(car.x, 0, car.z);
  }
  peds.forEach((ped, i) => {
    ped.x += ped.dir * ped.speed * dt;
    if (ped.x > 22) ped.x -= 44;
    if (ped.x < -22) ped.x += 44;
    ped.rig.group.position.set(ped.x, 0, ped.z);
    ped.rig.group.rotation.y = ped.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    ped.rig.group.visible = i < q.peds;
    animateWalk(ped.rig, ped.speed, dt);
  });
  streetLights.forEach((l, i) => { l.allowed = i < q.lamps; });
  const sv = levelOf(G.xp) >= 2;
  if (shelfMesh) shelfMesh.visible = false;
  BOOKS.forEach((b, i) => { if (BOOK_MESHES[i]) BOOK_MESHES[i].visible = sv && !b.mandatory; });
  const insideShop = G.player.x > -5.2 && G.player.x < ROOM.maxX + 0.4 && G.player.z > -4.5 && G.player.z < 4.5;
  const rv = !insideShop && camera.position.y < 2.15;
  for (const r of roofs) r.visible = rv;
  if (openPlate) {
    const o = isShopOpen(G.minutes);
    if (shopSignState.open !== o) { shopSignState.open = o; openPlate.userData.redraw(); }
  }
}

function applyQuality() {
  const q = QUALITY[settings.quality] || QUALITY.medium;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q.pr) * dynPR);
  renderer.shadowMap.enabled = q.shadows;
  renderer.shadowMap.autoUpdate = true;
  sun.castShadow = q.shadows;
  if (sun.shadow.mapSize.x !== q.smap) {
    sun.shadow.mapSize.set(q.smap, q.smap);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  // Fewer real-time lights = far cheaper shaders on weak devices
  shopMainLights.forEach(l => { l.visible = true; });
  shopFillLights.forEach(l => { l.visible = q.fill; });
  shopLight.visible = q.extra;
  bedLight.visible = q.extra;
  streetLights.forEach((l, i) => { l.visible = i < q.lamps; });
  hemi.userData.boost = q.extra ? 0 : 0.18;
  scene.traverse(o => { if (o.isMesh && o.material) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => { m.needsUpdate = true; }); } });
}

let audioCtx = null;
function tone(freq, dur, type, vol) {
  if (settings.volume <= 0) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = (settings.volume / 100) * vol;
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {
    // Audio is optional.
  }
}
const SFX = {
  click: [660, 0.06, 'square', 0.15],
  success: [880, 0.25, 'sine', 0.25],
  fail: [160, 0.35, 'sawtooth', 0.2],
  drop: [90, 0.25, 'triangle', 0.4],
  page: [520, 0.04, 'square', 0.12],
  cash: [1200, 0.12, 'triangle', 0.2]
};
function sfx(name) {
  const a = SFX[name];
  if (a) tone(a[0], a[1], a[2], a[3]);
}
function vibrate(ms) {
  try {
    if (settings.vibrate && navigator.vibrate) navigator.vibrate(ms);
  } catch (e) {
    // Vibration is optional.
  }
}

  readFx = { t: 0, dur: first ? 3 : 2.5, d: 0, book: book, mesh: mesh, page: 0 };
  input.joy.x = 0; input.joy.y = 0;

  showCine(true);

}
function updateReading(dt) {
  const r = readFx;
  if (!r) return;
  r.t += dt;
  const k = Math.min(1, r.t / r.dur);
  r.d = 0.5 - 0.5 * Math.cos(Math.PI * k);   // night -> morning -> night -> morning
  $('cineText').textContent = r.d >= 0.5 ? '☀️ الصباح... ' + gx('ولا تزال تقرأ', 'ولا تزالين تقرئين') : '🌙 الليل... ' + gx('وأنت تقرأ', 'وأنتِ تقرئين');
  const pg = Math.floor(r.t / 1.8);
  if (pg !== r.page) { r.page = pg; sfx('page'); }
  if (k >= 1) finishReading();
}
function finishReading() {
  if (readFx && readFx.intro) { dropBookMesh(); readFx = null; finishCinematic(); return; }
  if (mode !== 'read' || !readFx) return;
  const book = readFx.book;
  dropBookMesh();
  readFx = null;

}

// ===== Save slots =====
function slotKey(n) { return SLOT_PREFIX + n; }
function readSlot(n) {
  const key = slotKey(n);
  try {
    return parseState(window.localStorage.getItem(key)) || parseState(window.localStorage.getItem(key + '.bak'));
  } catch (e) {
    return null;
  }
}
function writeSlot(n) {
  const key = slotKey(n);
  const text = serializeState(G, Date.now());
  try {
    const current = window.localStorage.getItem(key);
    if (parseState(current)) window.localStorage.setItem(key + '.bak', current);
    window.localStorage.setItem(key, text);
    return true;
  } catch (e) {
    toast('تعذر الحفظ على هذا الجهاز');
    return false;
  }
}
function autosaveNow() { writeSlot(0); }
function latestSlot() {
  let best = -1, bestTime = -1;
  for (let i = 0; i < 4; i++) {
    const st = readSlot(i);
    if (st && st.savedAt > bestTime) { bestTime = st.savedAt; best = i; }
  }
  return best;
}
function hasAnySave() { return latestSlot() >= 0; }

function renderSlots(kind) {
  const indices = kind === 'load' ? [0, 1, 2, 3] : [1, 2, 3];

      : 'فارغة';
    h += '<div class="row"><span>' + name + '<br><small>' + info + '</small></span>' +
      '<button class="btn small" data-slot="' + kind + ':' + i + '">' + (kind === 'load' ? 'تحميل' : 'حفظ') + '</button></div>';
  }
  $(kind === 'load' ? 'slotList' : 'saveList').innerHTML = h;
  showPanel(kind === 'load' ? 'pLoad' : 'pSave');
}

function loadSlot(n) {

function actDrop() {
  if (!introPhone) return;
  const p = G.player;
  detach(introPhone);
  scene.add(introPhone);
  introPhone.position.set(p.x + 0.45, 1.3, p.z + 0.3);
  dropAnim = { t: 0, dur: 0.7, sx: p.x + 0.45, sy: 1.3, sz: p.z + 0.3 };
  vibrate(300);
  sfx('drop');
}

function landPhone() {
  if (introPhone) { detach(introPhone); introPhone = null; }
  if (!tutorialJob) tutorialJob = createRepairJob(MODELS[0], 'screen', allowedMistakes(G), true, null, null);
  tutorialJob.visual = makePhoneMesh(MODELS[0], true);
  placeOnFloor(tutorialJob.visual);
  shake = 0.35;
  flash('rgba(255,255,255,.35)', 250);
  vibrate(300);
}

function updateCinematic(dt) {
  if (readFx && readFx.intro) { updateReading(dt); return; }
  if (!cine) return;
  cine.t += dt;
  while (cine && cine.idx < CINE_EVENTS.length && cine.t >= CINE_EVENTS[cine.idx].t) {
    const ev = CINE_EVENTS[cine.idx++];
    if (ev.text) $('cineText').textContent = ev.text;
    if (ev.act === 'drop') actDrop();
    if (ev.act === 'closeup') cameraMode = 'closeup';
    if (ev.act === 'flicker') flash('#000', 500);
    if (ev.act === 'deskread') { startDeskReading(); return; }
    if (ev.end) { finishCinematic(); return; }
  }
  if (dropAnim && introPhone) {
    dropAnim.t += dt;
    const k = Math.min(1, dropAnim.t / dropAnim.dur);
    const e = k * k;
    introPhone.position.set(
      dropAnim.sx + (FLOOR_PHONE.x - dropAnim.sx) * e,
      dropAnim.sy + (0.03 - dropAnim.sy) * e,
      dropAnim.sz + (FLOOR_PHONE.z - dropAnim.sz) * e
    );
    introPhone.rotation.y = k * 1.4;
    if (k >= 1) {
      dropAnim = null;
      landPhone();
    }
  }
}

function finishCinematic() {
  if (mode !== 'cine') return;
  dropBookMesh();
  readFx = null;
  if (introPhone) { detach(introPhone); introPhone = null; }
  dropAnim = null;
  cine = null;
  ensureTutorialOnFloor();
  G.player.x = -7.5;
  G.player.z = 0.5;
  G.player.face = 0;
  G.player.y = 0;
  G.player.vy = 0;

  setHud(true);

}

async function endDay(auto) {
  if (mode !== 'play') return;
  mode = 'sleep';
  closeAllPanels();
  setHud(false);
  const endMinute = G.minutes;
  try {
    await fade(true, 900);

    // Customers still waiting leave; their phones are returned.
    for (const c of customers) {
      if (c.phase !== 'gone') {
        G.today.left++;
        if (c.job && !c.job.delivered) {
          c.job.abandoned = true;
          if (carried === c.job) releaseCarried();
        }
      }
      scene.remove(c.mesh);
      c.phase = 'gone';
    }
    customers = [];
    slotsUsed = [false, false, false];
    bench.update();

    const entry = closeDay(G);
    spawnTimer = Math.max(0, spawnInterval() - 10);   // first customer arrives soon after opening
    shopClosedNotified = false;
    planTraffic();
    // Wake up next to the bed.
    G.player.x = -7.5; G.player.z = 0.5; G.player.y = 0; G.player.vy = 0;
    autosaveNow();
    showReport(entry, auto, endMinute);   // panels are above the black fade (z-index)
    await new Promise(resolve => { reportResolver = resolve; });
    reportResolver = null;
    closePanel();
    toast('صباح جديد · المحل مفتوح الآن');
  } catch (err) {
    console.error(err);
    closeAllPanels();
  } finally {
    await fade(false, 900);
    mode = 'play';
    setHud(true);
  }
}

// --- Flow ---
function fitPhone() {
  const cell = $('phCell'), wrap = $('phoneWrap');
  if (!cell || !wrap || $('repair').classList.contains('hidden')) return;
  const w = cell.clientWidth - 16, h = cell.clientHeight - 16;
  if (w <= 0 || h <= 0) return;
  const H = Math.max(80, Math.min(h, w * 2));
  wrap.style.height = H + 'px';
  wrap.style.width = (H / 2) + 'px';
}

function enterRepair(job) {
  const phoneWrap = $('phoneWrap'); if (phoneWrap) phoneWrap.classList.remove('phone-flipping');
  const oldTray = $('trayOld'); if (oldTray) oldTray.classList.remove('screen-drop-target');
  rp.job = job;
  rp.open = true;
  rp.locked = false;
  rp.drag = null;
  mode = 'repair';
  setHud(false);
  closeAllPanels();
  $('repair').classList.remove('hidden');
  fitPhone();
  requestAnimationFrame(fitPhone);
  startStep();
}

function exitRepair(msg) {
  if (mode !== 'repair') return;
  const phoneWrap = $('phoneWrap'); if (phoneWrap) phoneWrap.classList.remove('phone-flipping');
  const oldTray = $('trayOld'); if (oldTray) oldTray.classList.remove('screen-drop-target');
  cancelDrag();
  rp.open = false;
  rp.handlers = null;
  rp.holding = false;
  $('repair').classList.add('hidden');
  mode = 'play';
  setHud(true);
  if (msg) toast(msg);
}

function startStep() {
  const job = rp.job;
  const step = currentStep(job);
  if (!step) return;
  if (job.sdIndex !== job.stepIndex) { job.sd = {}; job.sdIndex = job.stepIndex; }
  rp.locked = false;
  // Do not change the visible phone face when a flip step begins.
  // The player must physically trigger the 3D flip; STEP_IMPL.flip changes the face mid-animation.
  rp.layerFn = null;
  rp.handlers = null;
  rp.holding = false;
  $('rpTitle').textContent = step.title;
  $('rpStepNo').textContent = 'الخطوة ' + (job.stepIndex + 1) + ' من ' + job.steps.length;
  $('rpText').textContent = step.text + (step.tool ? ' · ' + TOOL_ICONS[step.tool] + ' ' + TOOL_NAMES[step.tool] : '');
  STEP_IMPL[step.kind](step, job.sd, job);
  renderTools();
  renderTrays();
  renderCard();
  rpRender();
  scheduleIdleRepairHint(step);
}

function completeStep() {
  hideIdleRepairHint();
  const job = rp.job;
  const step = currentStep(job);
  if (!step || rp.locked) return;
  rp.locked = true;
  rp.handlers = null;
  rp.holding = false;
  if (step.after === 'screenOn') job.v.scr = 'new';
  const outcome = advanceStep(job);
  rpPop('✔');
  sfx(outcome === 'completed' ? 'success' : 'click');
  vibrate(25);
  renderCard();
  renderTrays();
  rpRender();
  if (outcome === 'completed') {
    setTimeout(() => { if (rp.open) finishRepairJob(true); }, 700);
  } else {
    setTimeout(() => { if (rp.open) startStep(); }, 550);
  }
}

function finishRepairJob(success) {
  const job = rp.job;
  if (!job) return;
  exitRepair();
  rp.locked = false;
  if (bench.job === job) bench.job = null;
  refreshPhoneMesh(job);
  if (job.tutorial) {
    finishTutorialRepair(job, success);
  } else {
    const res = finishRepair(G, job, G.minutes);
    carry(job);
    if (res) {
      toast(res.success ? 'نجح الإصلاح! سلّم الهاتف للزبون' : 'فشل الإصلاح');
      sfx(res.success ? 'success' : 'fail');
      flash(res.success ? 'rgba(123,216,143,.35)' : 'rgba(255,107,107,.4)', 350);
      vibrate(res.success ? 30 : 200);
    }
  }
}
